# Builds the Pacelog Android app and publishes the APK as a GitHub Release,
# so it can be downloaded straight to a phone from the Releases page.
name: Android APK

on:
  push:
    branches: [main, claude/brave-johnson-zf7ogp]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test domain logic
        run: gradle :core:test --console=plain

      - name: Build APK
        run: gradle :app:assembleRelease --console=plain --stacktrace
        env:
          PACELOG_VERSION_CODE: ${{ github.run_number }}

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Pacelog.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Pacelog-apk
          path: Pacelog.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pacelog-v1.0.${{ github.run_number }}
          name: Pacelog 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Pacelog.apk
          body: |
            Pacelog for Android — download **Pacelog.apk** below on your phone and open it to install.
            Your data stays on your phone; use Settings → Save backup to keep a copy.
