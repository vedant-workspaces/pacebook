# Local PostgreSQL for development and tests.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pacebook
      POSTGRES_PASSWORD: pacebook
      POSTGRES_DB: pacebook
    ports:
      - "5432:5432"
    volumes:
      - pacebook-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pacebook-db:
