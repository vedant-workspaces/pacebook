# Local PostgreSQL for development and tests.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pacelog
      POSTGRES_PASSWORD: pacelog
      POSTGRES_DB: pacelog
    ports:
      - "5432:5432"
    volumes:
      - pacelog-db:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
volumes:
  pacelog-db:
